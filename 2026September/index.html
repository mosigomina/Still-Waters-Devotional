<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Still Waters | September 2026 Edition</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1b2a;
      --card-bg:   #132235;
      --card-hov:  #1b3050;
      --gold:      #c9a84c;
      --gold-lt:   #e8c97a;
      --cream:     #e8dcc8;
      --muted:     #8a9bb0;
      --border:    rgba(201,168,76,0.18);
      --radius:    12px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--cream);
      font-family: 'Georgia', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ─── HEADER ─── */
    header {
      background: linear-gradient(160deg, #0a1525 0%, #1a3050 60%, #0d1b2a 100%);
      border-bottom: 1px solid var(--border);
      text-align: center;
      padding: 40px 24px 36px;
    }
    .header-nav {
      max-width: 800px;
      margin: 0 auto 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .edition-badge {
      display: inline-block;
      background: rgba(201,168,76,0.12);
      border: 1px solid var(--border);
      color: var(--gold);
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
    }
    .archive-select {
      background: var(--card-bg);
      color: var(--gold-lt);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.8rem;
      cursor: pointer;
    }
    header h1 {
      font-size: clamp(2.5rem, 6vw, 3.8rem);
      color: var(--gold-lt);
      letter-spacing: 3px;
      font-weight: 400;
      margin-bottom: 12px;
    }
    .header-theme {
      color: var(--cream);
      font-size: 1.1rem;
      font-style: italic;
      opacity: 0.85;
    }

    /* ─── MAIN CONTENT ─── */
    main {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 40px clamp(16px, 5vw, 40px) 80px;
      flex: 1;
    }
    .section-label {
      text-align: center;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 32px;
    }

    /* ─── TODAY FEATURE BANNER ─── */
    .today-feature {
      background: linear-gradient(135deg, rgba(201,168,76,0.1) 0%, rgba(201,168,76,0.03) 100%);
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: 14px;
      padding: 30px 36px;
      margin-bottom: 44px;
      text-align: center;
    }
    .today-feature-label {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 12px;
    }
    .today-feature-title {
      font-size: clamp(1.1rem, 3vw, 1.55rem);
      color: var(--cream);
      font-weight: 400;
      margin-bottom: 16px;
      line-height: 1.3;
    }
    .today-feature-btn {
      background: var(--gold);
      color: #0a1525;
      border: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      letter-spacing: 0.3px;
    }
    .today-feature-btn:hover { background: var(--gold-lt); transform: translateY(-2px); }

    /* ─── CALENDAR GRID ─── */
    .calendar-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-bottom: 8px;
    }
    .cal-day-name {
      text-align: center;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 4px;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }
    .cal-empty {
      background: transparent;
    }
    .day-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 10px 12px;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      text-align: center;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
    }
    .day-card:hover {
      background: var(--card-hov);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(201,168,76,0.12);
      border-color: rgba(201,168,76,0.4);
    }
    .day-card:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }
    .day-num {
      font-family: 'Segoe UI', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--gold);
      line-height: 1;
    }
    .day-title {
      font-size: 0.65rem;
      color: var(--muted);
      line-height: 1.3;
      font-family: 'Segoe UI', sans-serif;
    }

    /* ─── DATE-AWARE STATES ─── */
    .day-card.locked {
      opacity: 0.3;
      cursor: not-allowed;
      filter: grayscale(60%);
      pointer-events: none;
    }
    .day-card.today {
      border-color: var(--gold);
      box-shadow: 0 0 0 1px var(--gold), 0 6px 24px rgba(201,168,76,0.28);
      background: #1d2f45;
    }
    .day-card.today .day-num { color: var(--gold-lt); }
    .today-badge {
      display: inline-block;
      background: var(--gold);
      color: #0a1525;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.56rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 6px;
    }
    .lock-icon { font-size: 0.8rem; opacity: 0.4; margin-top: auto; }

    /* ─── FOOTER ─── */
    footer {
      text-align: center;
      padding: 32px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.78rem;
      color: #3a4e63;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    @media (max-width: 600px) {
      header { padding: 36px 16px 28px; }
      .calendar-grid { gap: 5px; }
      .day-card { padding: 10px 6px; min-height: 72px; }
      .day-num { font-size: 1.1rem; }
      .day-title { font-size: 0.58rem; }
      .today-feature { padding: 20px 16px; }
      .today-feature-btn { width: 100%; padding: 12px 16px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-nav">
      <div class="edition-badge">September 2026 Edition</div>
      <select class="archive-select" onchange="if(this.value) location.href = this.value;">
        <option value="">📁 Archive Menu</option>
        <option value="../index.html">Main Home</option>
        <option value="../2026August/index.html">August 2026</option>
        <option value="../2026July/index.html">July 2026</option>
      </select>
    </div>
    <h1>Still Waters</h1>
    <p class="header-theme">Desiring God</p>
  </header>

  <main>
    <p class="section-label">Select a day to read</p>

    <div id="todayFeature" class="today-feature" style="display:none;">
      <div class="today-feature-label">📅 Today’s Devotional</div>
      <h2 class="today-feature-title" id="todayFeatTitle"></h2>
      <button class="today-feature-btn" id="todayFeatBtn">Read Today’s Devotional →</button>
    </div>

    <div class="calendar-header">
      <div class="cal-day-name">Sun</div>
      <div class="cal-day-name">Mon</div>
      <div class="cal-day-name">Tue</div>
      <div class="cal-day-name">Wed</div>
      <div class="cal-day-name">Thu</div>
      <div class="cal-day-name">Fri</div>
      <div class="cal-day-name">Sat</div>
    </div>

    <div class="calendar-grid" id="calGrid"></div>
  </main>

  <footer>&copy; 2026 Christ Discipleship Place, Lokoja</footer>

<script>
const septemberData = [
  { "day": 1, "title": "Spiritual Inconsistency" },
  { "day": 2, "title": "Why So Fickle?" },
  { "day": 3, "title": "Self-Denial and Personal Pleasure" },
  { "day": 4, "title": "Facing Persecution" },
  { "day": 5, "title": "Self-Love vs God-Love" },
  { "day": 6, "title": "Desire’s Assurance" },
  { "day": 7, "title": "Pleasure in Loving God" },
  { "day": 8, "title": "The Sufficiency of God" },
  { "day": 9, "title": "I Love Him, I Love Him Not?" },
  { "day": 10, "title": "Complications with Consistency" },
  { "day": 11, "title": "Ambitions and Dreams" },
  { "day": 12, "title": "Finding Doubles for God" },
  { "day": 13, "title": "Enjoying Earthly Things" },
  { "day": 14, "title": "Worldly Pleasures" },
  { "day": 15, "title": "Desire in Distraction" },
  { "day": 16, "title": "Knowing God, Loving God" },
  { "day": 17, "title": "One Focus" },
  { "day": 18, "title": "God-Centred Living" },
  { "day": 19, "title": "Spiritual Hunger as Feeling vs. Cultivation" },
  { "day": 20, "title": "Spiritual Discipline" },
  { "day": 21, "title": "Where Is Your Hunger?" },
  { "day": 22, "title": "Religious Routine" },
  { "day": 23, "title": "Don’t Want! Don’t Care!" },
  { "day": 24, "title": "Community and Desire" },
  { "day": 25, "title": "Draining Relationships" },
  { "day": 26, "title": "Qualities of Spiritual Companions" },
  { "day": 27, "title": "Growing Desire" },
  { "day": 28, "title": "What About Obedience and Holiness?" },
  { "day": 29, "title": "Relationships, Purpose, and Service" },
  { "day": 30, "title": "Desiring God Every Day" }
];

// September 1, 2026 starts on a Tuesday (Index 2: Sun=0, Mon=1, Tue=2)
const startDow = 2; 
const targetMonthIndex = 8; // September

// ─── DATE DETECTION (Africa/Lagos, UTC+1) ───
const nowLagos = new Date(new Date().toLocaleString('en-US', { timeZone: 'Africa/Lagos' }));
const year  = nowLagos.getFullYear();
const month = nowLagos.getMonth();
const day   = nowLagos.getDate();

let unlockedUpTo = 0;

if (year > 2026) {
  unlockedUpTo = septemberData.length;
} else if (year < 2026) {
  unlockedUpTo = 0;
} else {
  if (month > targetMonthIndex) {
    unlockedUpTo = septemberData.length;
  } else if (month === targetMonthIndex) {
    unlockedUpTo = day;
  } else {
    unlockedUpTo = 0;
  }
}

// Featured Banner
if (unlockedUpTo > 0) {
  const todayData = septemberData[Math.min(unlockedUpTo, septemberData.length) - 1];
  document.getElementById('todayFeatTitle').textContent = todayData.title;
  document.getElementById('todayFeatBtn').addEventListener('click', () => {
    window.location.href = `day${unlockedUpTo}.html`;
  });
  document.getElementById('todayFeature').style.display = 'block';
}

// ─── BUILD CALENDAR GRID ───
const grid = document.getElementById('calGrid');

for (let i = 0; i < startDow; i++) {
  const empty = document.createElement('div');
  empty.className = 'cal-empty';
  grid.appendChild(empty);
}

septemberData.forEach(d => {
  const isToday  = d.day === unlockedUpTo;
  const isLocked = d.day > unlockedUpTo;

  const card = document.createElement('div');
  card.className = 'day-card' + (isToday ? ' today' : '') + (isLocked ? ' locked' : '');

  if (!isLocked) {
    card.setAttribute('tabindex', '0');
    card.setAttribute('role', 'button');
    card.addEventListener('click', () => {
      window.location.href = `day${d.day}.html`;
    });
  }

  card.innerHTML = `
    <div class="day-num">${d.day}</div>
    <div class="day-title">${d.title}</div>
    ${isToday  ? '<div class="today-badge">Today</div>' : ''}
    ${isLocked ? '<div class="lock-icon">🔒</div>' : ''}
  `;

  grid.appendChild(card);
});
</script>
</body>
</html>
