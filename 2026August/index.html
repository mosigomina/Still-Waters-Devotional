<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Still Waters | August 2026 — The Greatness of God</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1b2a;
      --card-bg:   #132235;
      --card-hov:  #1b3050;
      --gold:      #c9a84c;
      --gold-lt:   #e8c97a;
      --cream:     #e8dcc8;
      --muted:     #8a9bb0;
      --border:    rgba(201,168,76,0.18);
      --radius:    12px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--cream);
      font-family: 'Georgia', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ─── HEADER & ARCHIVE NAV ─── */
    header {
      background: linear-gradient(160deg, #0a1525 0%, #1a3050 60%, #0d1b2a 100%);
      border-bottom: 1px solid var(--border);
      text-align: center;
      padding: 40px 24px 36px;
    }
    .header-nav {
      max-width: 800px;
      margin: 0 auto 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .edition-badge {
      display: inline-block;
      background: rgba(201,168,76,0.12);
      border: 1px solid var(--border);
      color: var(--gold);
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
    }
    .archive-select {
      background: var(--card-bg);
      color: var(--gold-lt);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.8rem;
      cursor: pointer;
    }
    header h1 {
      font-size: clamp(2.5rem, 6vw, 3.8rem);
      color: var(--gold-lt);
      letter-spacing: 3px;
      font-weight: 400;
      margin-bottom: 12px;
    }
    .header-theme {
      color: var(--cream);
      font-size: 1.1rem;
      font-style: italic;
      opacity: 0.85;
    }

    /* ─── MAIN ─── */
    main {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 40px clamp(16px, 5vw, 40px) 80px;
      flex: 1;
    }
    .section-label {
      text-align: center;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 32px;
    }

    /* ─── CALENDAR GRID ─── */
    .calendar-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-bottom: 8px;
    }
    .cal-day-name {
      text-align: center;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 4px;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }
    .cal-empty {
      background: transparent;
    }
    .day-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 10px 12px;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      text-align: center;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
    }
    .day-card:hover {
      background: var(--card-hov);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(201,168,76,0.12);
      border-color: rgba(201,168,76,0.4);
    }
    .day-card:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }
    .day-num {
      font-family: 'Segoe UI', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--gold);
      line-height: 1;
    }
    .day-title {
      font-size: 0.65rem;
      color: var(--muted);
      line-height: 1.3;
      font-family: 'Segoe UI', sans-serif;
    }

    /* ─── DATE-AWARE STATES ─── */
    .day-card.locked {
      opacity: 0.3;
      cursor: not-allowed;
      filter: grayscale(60%);
      pointer-events: none;
    }
    .day-card.today {
      border-color: var(--gold);
      box-shadow: 0 0 0 1px var(--gold), 0 6px 24px rgba(201,168,76,0.28);
      background: #1d2f45;
    }
    .day-card.today .day-num { color: var(--gold-lt); }
    .today-badge {
      display: inline-block;
      background: var(--gold);
      color: #0a1525;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.56rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 6px;
    }
    .lock-icon { font-size: 0.8rem; opacity: 0.4; margin-top: auto; }

    /* ─── TODAY FEATURE BANNER ─── */
    .today-feature {
      background: linear-gradient(135deg, rgba(201,168,76,0.1) 0%, rgba(201,168,76,0.03) 100%);
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: 14px;
      padding: 30px 36px;
      margin-bottom: 44px;
      text-align: center;
    }
    .today-feature-label {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 12px;
    }
    .today-feature-title {
      font-size: clamp(1.1rem, 3vw, 1.55rem);
      color: var(--cream);
      font-weight: 400;
      margin-bottom: 16px;
      line-height: 1.3;
    }
    .today-feature-btn {
      background: var(--gold);
      color: #0a1525;
      border: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      letter-spacing: 0.3px;
    }
    .today-feature-btn:hover { background: var(--gold-lt); transform: translateY(-2px); }
    .feature-notice {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.95rem;
      color: var(--muted);
      text-align: center;
      padding: 24px 32px;
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 40px;
      line-height: 1.7;
    }
    .feature-notice strong { color: var(--gold-lt); }

    /* ─── FOOTER ─── */
    footer {
      text-align: center;
      padding: 32px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.78rem;
      color: #3a4e63;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 600px) {
      header { padding: 36px 16px 28px; }
      .calendar-grid { gap: 5px; }
      .day-card { padding: 10px 6px; min-height: 72px; }
      .day-num { font-size: 1.1rem; }
      .day-title { font-size: 0.58rem; }
      .today-feature { padding: 20px 16px; }
      .today-feature-btn { width: 100%; padding: 12px 16px; }
    }
    @media (max-width: 380px) {
      .calendar-header, .calendar-grid { grid-template-columns: repeat(7, 1fr); gap: 3px; }
      .day-card { min-height: 58px; padding: 8px 3px; }
      .day-num { font-size: 0.95rem; }
      .day-title { display: none; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-nav">
      <div class="edition-badge">August 2026 Edition</div>
      <select class="archive-select" onchange="if(this.value) location.href = this.value;">
        <option value="">📁 Archive Menu</option>
        <option value="../index.html">August 2026 (Active)</option>
        <option value="../2026July/index.html">July 2026</option>
      </select>
    </div>
    <h1>Still Waters</h1>
    <p class="header-theme">The Greatness of God</p>
  </header>

  <main>
    <p class="section-label">Select a day to read</p>

    <!-- Today Feature / Notice -->
    <div id="todayFeature" class="today-feature" style="display:none;">
      <div class="today-feature-label">📅 Today’s Devotional</div>
      <h2 class="today-feature-title" id="todayFeatTitle"></h2>
      <button class="today-feature-btn" id="todayFeatBtn">Read Today’s Devotional →</button>
    </div>
    <div id="featureNotice" class="feature-notice" style="display:none;"></div>

    <!-- Day-name row -->
    <div class="calendar-header">
      <div class="cal-day-name">Sun</div>
      <div class="cal-day-name">Mon</div>
      <div class="cal-day-name">Tue</div>
      <div class="cal-day-name">Wed</div>
      <div class="cal-day-name">Thu</div>
      <div class="cal-day-name">Fri</div>
      <div class="cal-day-name">Sat</div>
    </div>

    <div class="calendar-grid" id="calGrid"></div>
  </main>

  <footer>&copy; 2026 Christ Discipleship Place, Lokoja</footer>

<script>
const data = [
  { "day": 1, "title": "The Problem of Empty Hands", "ref": "Exodus 16:3" },
  { "day": 2, "title": "Enough for Today", "ref": "Exodus 16:4" },
  { "day": 3, "title": "The Outsiders Get Bread Too", "ref": "Psalm 145:16" },
  { "day": 4, "title": "Grumbling and Gratitude", "ref": "Job 2:10" },
  { "day": 5, "title": "The Desperate Outsider", "ref": "John 10:16" },
  { "day": 6, "title": "The Test of Trust", "ref": "Deuteronomy 8:2–3" },
  { "day": 7, "title": "Rest in His Provision", "ref": "Matthew 11:28–30" },
  { "day": 8, "title": "God’s Unusual Providers", "ref": "John 6:8–9" },
  { "day": 9, "title": "When Pride Almost Costs Everything", "ref": "2 Kings 5:14" },
  { "day": 10, "title": "Healing at a Distance", "ref": "Matthew 8:10" },
  { "day": 11, "title": "The Long-Term Sufferer", "ref": "Mark 5:34" },
  { "day": 12, "title": "Healing and Forgiveness Together", "ref": "Psalm 103:3" },
  { "day": 13, "title": "The Blind Who Cried Out", "ref": "Mark 10:52" },
  { "day": 14, "title": "The Deaf Who Could Not Hear", "ref": "Hebrews 2:1" },
  { "day": 15, "title": "Breaking Identity Chains", "ref": "Romans 8:16" },
  { "day": 16, "title": "The Blood That Breaks Power", "ref": "Luke 22:20" },
  { "day": 17, "title": "The God Who Fights for You", "ref": "Mark 4:39" },
  { "day": 18, "title": "The Enemy’s Defeat", "ref": "Luke 10:19" },
  { "day": 19, "title": "Out of the Wilderness", "ref": "Matthew 4:1–2" },
  { "day": 20, "title": "The Danger of an Empty House", "ref": "Matthew 12:43–44" },
  { "day": 21, "title": "Set Free to Serve", "ref": "Exodus 7:16" },
  { "day": 22, "title": "The Broken Covenant", "ref": "Luke 22:61–62" },
  { "day": 23, "title": "The Grief of Wandering", "ref": "Lamentations 3:22–23" },
  { "day": 24, "title": "A Future and a Hope", "ref": "Jeremiah 29:11" },
  { "day": 25, "title": "Rebuilding the Ruins", "ref": "Nehemiah 2:17" },
  { "day": 26, "title": "The Second Chance", "ref": "John 21:17" },
  { "day": 27, "title": "Restoration with Scars", "ref": "Haggai 2:9" },
  { "day": 28, "title": "The Banquet Restored", "ref": "Revelation 19:9" },
  { "day": 29, "title": "Can These Bones Live?", "ref": "Ezekiel 37:10" },
  { "day": 30, "title": "The Foretaste", "ref": "Matthew 12:40" },
  { "day": 31, "title": "The Firstborn from the Dead", "ref": "1 Corinthians 15:20" }
];

// ─── Date Detection (Africa/Lagos, UTC+1) ─────────────────────────────────────────
const nowLagos   = new Date(new Date().toLocaleString('en-US', { timeZone: 'Africa/Lagos' }));
const todayYear  = nowLagos.getFullYear();
const todayMonth = nowLagos.getMonth(); 
const todayDay   = nowLagos.getDate();

const AUGUST = 7, YEAR = 2026; // Month 7 = August (0-indexed)
let unlockedUpTo = 0; 
let archiveMode  = false;

if (todayYear > YEAR || (todayYear === YEAR && todayMonth > AUGUST)) {
  archiveMode  = true; 
  unlockedUpTo = 31;
} else if (todayYear === YEAR && todayMonth === AUGUST) {
  unlockedUpTo = todayDay; 
}

// ─── Today Feature / Notice ──────────────────────────────────────────────
const todayFeature  = document.getElementById('todayFeature');
const featureNotice = document.getElementById('featureNotice');

if (archiveMode) {
  featureNotice.style.display = 'block';
  featureNotice.innerHTML = '📖 <strong>August 2026 Archive</strong><br>All 31 devotionals are available to read. Select any day below.';
} else if (unlockedUpTo === 0) {
  featureNotice.style.display = 'block';
  featureNotice.innerHTML = '🕊️ <strong>Still Waters Daily Devotional</strong> August edition begins <strong>1 August 2026</strong>.<br>A new devotional unlocks every day.';
} else {
  const todayData = data[unlockedUpTo - 1];
  document.getElementById('todayFeatTitle').textContent = todayData.title;
  document.getElementById('todayFeatBtn').addEventListener('click', () => openDay(unlockedUpTo));
  todayFeature.style.display = 'block';
}

// ─── Build Calendar Grid ───────────────────────────────────────────────────
const grid = document.getElementById('calGrid');
const START_DOW = 6; // Saturday (August 1, 2026 starts on Saturday)

for (let i = 0; i < START_DOW; i++) {
  const empty = document.createElement('div');
  empty.className = 'cal-empty';
  grid.appendChild(empty);
}

data.forEach(d => {
  const isToday  = !archiveMode && (d.day === unlockedUpTo);
  const isLocked = d.day > unlockedUpTo;

  const card = document.createElement('div');
  card.className = 'day-card' + (isToday ? ' today' : '') + (isLocked ? ' locked' : '');

  if (!isLocked) {
    card.setAttribute('tabindex', '0');
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', `August ${d.day}: ${d.title}`);
    card.addEventListener('click', () => openDay(d.day));
    card.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDay(d.day); }
    });
  } else {
    card.setAttribute('aria-label', `August ${d.day}: not yet available`);
    card.setAttribute('aria-disabled', 'true');
  }

  card.innerHTML = `
    <div class="day-num">${d.day}</div>
    <div class="day-title">${d.title}</div>
    ${isToday  ? '<div class="today-badge">Today</div>' : ''}
    ${isLocked ? '<div class="lock-icon">🔒</div>' : ''}
  `;

  grid.appendChild(card);
});

// ─── Direct Relative Navigation (Inside 2026August Folder) ───────────────
function openDay(dayNum) {
  window.location.href = `day${dayNum}.html`;
}
</script>
</body>
</html>
