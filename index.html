<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">Still Waters Daily Devotional</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1b2a;
      --card-bg:   #132235;
      --card-hov:  #1b3050;
      --gold:      #c9a84c;
      --gold-lt:   #e8c97a;
      --cream:     #e8dcc8;
      --muted:     #8a9bb0;
      --border:    rgba(201,168,76,0.18);
      --radius:    12px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--cream);
      font-family: 'Georgia', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ─── HEADER & ARCHIVE NAV ─── */
    header {
      background: linear-gradient(160deg, #0a1525 0%, #1a3050 60%, #0d1b2a 100%);
      border-bottom: 1px solid var(--border);
      text-align: center;
      padding: 40px 24px 36px;
    }
    .header-nav {
      max-width: 800px;
      margin: 0 auto 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .edition-badge {
      display: inline-block;
      background: rgba(201,168,76,0.12);
      border: 1px solid var(--border);
      color: var(--gold);
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
    }
    .archive-select {
      background: var(--card-bg);
      color: var(--gold-lt);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.8rem;
      cursor: pointer;
    }
    header h1 {
      font-size: clamp(2.5rem, 6vw, 3.8rem);
      color: var(--gold-lt);
      letter-spacing: 3px;
      font-weight: 400;
      margin-bottom: 12px;
    }
    .header-theme {
      color: var(--cream);
      font-size: 1.1rem;
      font-style: italic;
      opacity: 0.85;
    }

    /* ─── MAIN ─── */
    main {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 40px clamp(16px, 5vw, 40px) 80px;
      flex: 1;
    }
    .section-label {
      text-align: center;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 32px;
    }

    /* ─── CALENDAR GRID ─── */
    .calendar-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-bottom: 8px;
    }
    .cal-day-name {
      text-align: center;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 4px;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }
    .cal-empty {
      background: transparent;
    }
    .day-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 10px 12px;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      text-align: center;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
    }
    .day-card:hover {
      background: var(--card-hov);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(201,168,76,0.12);
      border-color: rgba(201,168,76,0.4);
    }
    .day-card:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }
    .day-num {
      font-family: 'Segoe UI', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--gold);
      line-height: 1;
    }
    .day-title {
      font-size: 0.65rem;
      color: var(--muted);
      line-height: 1.3;
      font-family: 'Segoe UI', sans-serif;
    }

    /* ─── DATE-AWARE STATES ─── */
    .day-card.locked {
      opacity: 0.3;
      cursor: not-allowed;
      filter: grayscale(60%);
      pointer-events: none;
    }
    .day-card.today {
      border-color: var(--gold);
      box-shadow: 0 0 0 1px var(--gold), 0 6px 24px rgba(201,168,76,0.28);
      background: #1d2f45;
    }
    .day-card.today .day-num { color: var(--gold-lt); }
    .today-badge {
      display: inline-block;
      background: var(--gold);
      color: #0a1525;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.56rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 6px;
    }
    .lock-icon { font-size: 0.8rem; opacity: 0.4; margin-top: auto; }

    /* ─── TODAY FEATURE BANNER ─── */
    .today-feature {
      background: linear-gradient(135deg, rgba(201,168,76,0.1) 0%, rgba(201,168,76,0.03) 100%);
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: 14px;
      padding: 30px 36px;
      margin-bottom: 44px;
      text-align: center;
    }
    .today-feature-label {
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 12px;
    }
    .today-feature-title {
      font-size: clamp(1.1rem, 3vw, 1.55rem);
      color: var(--cream);
      font-weight: 400;
      margin-bottom: 16px;
      line-height: 1.3;
    }
    .today-feature-btn {
      background: var(--gold);
      color: #0a1525;
      border: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      letter-spacing: 0.3px;
    }
    .today-feature-btn:hover { background: var(--gold-lt); transform: translateY(-2px); }

    /* ─── FOOTER ─── */
    footer {
      text-align: center;
      padding: 32px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.78rem;
      color: #3a4e63;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    @media (max-width: 600px) {
      header { padding: 36px 16px 28px; }
      .calendar-grid { gap: 5px; }
      .day-card { padding: 10px 6px; min-height: 72px; }
      .day-num { font-size: 1.1rem; }
      .day-title { font-size: 0.58rem; }
      .today-feature { padding: 20px 16px; }
      .today-feature-btn { width: 100%; padding: 12px 16px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-nav">
      <div class="edition-badge" id="editionBadge">Loading Edition...</div>
      <select class="archive-select" onchange="if(this.value) location.href = this.value;">
        <option value="">📁 Archive Menu</option>
        <option value="2026September/index.html">September 2026</option>
        <option value="2026August/index.html">August 2026</option>
        <option value="2026July/index.html">July 2026</option>
      </select>
    </div>
    <h1>Still Waters</h1>
    <p class="header-theme" id="headerTheme"></p>
  </header>

  <main>
    <p class="section-label">Select a day to read</p>

    <div id="todayFeature" class="today-feature" style="display:none;">
      <div class="today-feature-label">📅 Today’s Devotional</div>
      <h2 class="today-feature-title" id="todayFeatTitle"></h2>
      <button class="today-feature-btn" id="todayFeatBtn">Read Today’s Devotional →</button>
    </div>

    <div class="calendar-header">
      <div class="cal-day-name">Sun</div>
      <div class="cal-day-name">Mon</div>
      <div class="cal-day-name">Tue</div>
      <div class="cal-day-name">Wed</div>
      <div class="cal-day-name">Thu</div>
      <div class="cal-day-name">Fri</div>
      <div class="cal-day-name">Sat</div>
    </div>

    <div class="calendar-grid" id="calGrid"></div>
  </main>

  <footer>&copy; 2026 Christ Discipleship Place, Lokoja</footer>

<script>
// ─── DATA CONFIGURATIONS ───
const julyData = [
  { "day": 1, "title": "God Placed You in the Nation for a Purpose" },
  { "day": 2, "title": "You Are a Chosen People, a Holy Nation" },
  { "day": 3, "title": "You Are Strangers and Pilgrims on Earth" },
  { "day": 4, "title": "You Are in the World but Not of It" },
  { "day": 5, "title": "You Are Ambassadors for Christ" },
  { "day": 6, "title": "Pray for All People, Especially Leaders" },
  { "day": 7, "title": "Seek the Peace of the Nation in Prayer" },
  { "day": 8, "title": "Dominion Belongs to the Lord" },
  { "day": 9, "title": "Daniel Stood in the Gap for His Nation" },
  { "day": 10, "title": "The Effective Prayer of a Righteous Person" },
  { "day": 11, "title": "All Authority Comes from God" },
  { "day": 12, "title": "Submit for the Lord’s Sake" },
  { "day": 13, "title": "Rebelling Against Authority is Rebelling Against God" },
  { "day": 14, "title": "Give to Caesar What Belongs to Caesar" },
  { "day": 15, "title": "Give Honour to Whom Honour is Due" },
  { "day": 16, "title": "Live Peacefully with All Men" },
  { "day": 17, "title": "Work for the Welfare of Your City" },
  { "day": 18, "title": "Righteousness Exalts a Nation" },
  { "day": 19, "title": "Be Ready to Do Every Good Work" },
  { "day": 20, "title": "You Are the Salt of the Earth" },
  { "day": 21, "title": "You Are the Light of the World" },
  { "day": 22, "title": "Speak Up for Those Who Cannot Speak" },
  { "day": 23, "title": "Expose the Works of Darkness" },
  { "day": 24, "title": "The Courage to Stand Alone" },
  { "day": 25, "title": "We Must Obey God Rather Than Men" },
  { "day": 26, "title": "Overcome Evil with Good" },
  { "day": 27, "title": "My Kingdom Is Not of This World" },
  { "day": 28, "title": "When They Chose God Over the King" },
  { "day": 29, "title": "We Look for a Heavenly Country" },
  { "day": 30, "title": "We Await the Saviour from Heaven" },
  { "day": 31, "title": "The Kingdom That Will Never End" }
];

const augustData = [
  { "day": 1, "title": "The Problem of Empty Hands" },
  { "day": 2, "title": "Enough for Today" },
  { "day": 3, "title": "The Outsiders Get Bread Too" },
  { "day": 4, "title": "Grumbling and Gratitude" },
  { "day": 5, "title": "The Desperate Outsider" },
  { "day": 6, "title": "The Test of Trust" },
  { "day": 7, "title": "Rest in His Provision" },
  { "day": 8, "title": "God’s Unusual Providers" },
  { "day": 9, "title": "When Pride Almost Costs Everything" },
  { "day": 10, "title": "Healing at a Distance" },
  { "day": 11, "title": "The Long-Term Sufferer" },
  { "day": 12, "title": "Healing and Forgiveness Together" },
  { "day": 13, "title": "The Blind Who Cried Out" },
  { "day": 14, "title": "The Deaf Who Could Not Hear" },
  { "day": 15, "title": "Breaking Identity Chains" },
  { "day": 16, "title": "The Blood That Breaks Power" },
  { "day": 17, "title": "The God Who Fights for You" },
  { "day": 18, "title": "The Enemy’s Defeat" },
  { "day": 19, "title": "Out of the Wilderness" },
  { "day": 20, "title": "The Danger of an Empty House" },
  { "day": 21, "title": "Set Free to Serve" },
  { "day": 22, "title": "The Broken Covenant" },
  { "day": 23, "title": "The Grief of Wandering" },
  { "day": 24, "title": "A Future and a Hope" },
  { "day": 25, "title": "Rebuilding the Ruins" },
  { "day": 26, "title": "The Second Chance" },
  { "day": 27, "title": "Restoration with Scars" },
  { "day": 28, "title": "The Banquet Restored" },
  { "day": 29, "title": "Can These Bones Live?" },
  { "day": 30, "title": "The Foretaste" },
  { "day": 31, "title": "The Firstborn from the Dead" }
];

const septemberData = [
  { "day": 1, "title": "Spiritual Inconsistency" },
  { "day": 2, "title": "Why So Fickle?" },
  { "day": 3, "title": "Self-Denial and Personal Pleasure" },
  { "day": 4, "title": "Facing Persecution" },
  { "day": 5, "title": "Self-Love vs God-Love" },
  { "day": 6, "title": "Desire’s Assurance" },
  { "day": 7, "title": "Pleasure in Loving God" },
  { "day": 8, "title": "The Sufficiency of God" },
  { "day": 9, "title": "I Love Him, I Love Him Not?" },
  { "day": 10, "title": "Complications with Consistency" },
  { "day": 11, "title": "Ambitions and Dreams" },
  { "day": 12, "title": "Finding Doubles for God" },
  { "day": 13, "title": "Enjoying Earthly Things" },
  { "day": 14, "title": "Worldly Pleasures" },
  { "day": 15, "title": "Desire in Distraction" },
  { "day": 16, "title": "Knowing God, Loving God" },
  { "day": 17, "title": "One Focus" },
  { "day": 18, "title": "God-Centred Living" },
  { "day": 19, "title": "Spiritual Hunger as Feeling vs. Cultivation" },
  { "day": 20, "title": "Spiritual Discipline" },
  { "day": 21, "title": "Where Is Your Hunger?" },
  { "day": 22, "title": "Religious Routine" },
  { "day": 23, "title": "Don’t Want! Don’t Care!" },
  { "day": 24, "title": "Community and Desire" },
  { "day": 25, "title": "Draining Relationships" },
  { "day": 26, "title": "Qualities of Spiritual Companions" },
  { "day": 27, "title": "Growing Desire" },
  { "day": 28, "title": "What About Obedience and Holiness?" },
  { "day": 29, "title": "Relationships, Purpose, and Service" },
  { "day": 30, "title": "Desiring God Every Day" }
];

// ─── DATE DETECTION (Africa/Lagos, UTC+1) ───
const nowLagos = new Date(new Date().toLocaleString('en-US', { timeZone: 'Africa/Lagos' }));
const year  = nowLagos.getFullYear();
const month = nowLagos.getMonth(); // 6 = July, 7 = August, 8 = September
const day   = nowLagos.getDate();

let activeMonthData, folderName, themeText, badgeText, targetMonthIndex;

if (year > 2026 || (year === 2026 && month >= 8)) {
  activeMonthData  = septemberData;
  folderName       = '2026September';
  themeText        = 'Desiring God';
  badgeText        = 'September 2026 Edition';
  targetMonthIndex = 8;
} else if (year === 2026 && month === 7) {
  activeMonthData  = augustData;
  folderName       = '2026August';
  themeText        = 'The Greatness of God';
  badgeText        = 'August 2026 Edition';
  targetMonthIndex = 7;
} else {
  activeMonthData  = julyData;
  folderName       = '2026July';
  themeText        = 'The Believer’s Duty to the Nation';
  badgeText        = 'July 2026 Edition';
  targetMonthIndex = 6;
}

// Calculate starting day of week for grid alignment (0 = Sun, 1 = Mon...)
const startDow = new Date(2026, targetMonthIndex, 1).getDay();

// Set UI Header elements
document.getElementById('pageTitle').textContent = `Still Waters | ${badgeText} — ${themeText}`;
document.getElementById('editionBadge').textContent = badgeText;
document.getElementById('headerTheme').textContent = themeText;

// Strict date calculation: Only unlock days up to today's exact date
let unlockedUpTo = 0;

if (year > 2026) {
  // Past year: unlock all days in historical editions
  unlockedUpTo = activeMonthData.length;
} else if (year < 2026) {
  // Prior year relative to release: lock all days
  unlockedUpTo = 0;
} else {
  // Year is 2026: Compare current month against target month
  if (month > targetMonthIndex) {
    // Current month is past target month: unlock all days in target month
    unlockedUpTo = activeMonthData.length;
  } else if (month === targetMonthIndex) {
    // Currently in target month: unlock up to today's date
    unlockedUpTo = day;
  } else {
    // Target month is in the future: lock all days
    unlockedUpTo = 0;
  }
}

// Featured Banner
if (unlockedUpTo > 0) {
  const todayData = activeMonthData[Math.min(unlockedUpTo, activeMonthData.length) - 1];
  document.getElementById('todayFeatTitle').textContent = todayData.title;
  document.getElementById('todayFeatBtn').addEventListener('click', () => {
    window.location.href = `${folderName}/day${unlockedUpTo}.html`;
  });
  document.getElementById('todayFeature').style.display = 'block';
}

// ─── BUILD CALENDAR GRID ───
const grid = document.getElementById('calGrid');

for (let i = 0; i < startDow; i++) {
  const empty = document.createElement('div');
  empty.className = 'cal-empty';
  grid.appendChild(empty);
}

activeMonthData.forEach(d => {
  const isToday  = d.day === unlockedUpTo;
  const isLocked = d.day > unlockedUpTo;

  const card = document.createElement('div');
  card.className = 'day-card' + (isToday ? ' today' : '') + (isLocked ? ' locked' : '');

  if (!isLocked) {
    card.setAttribute('tabindex', '0');
    card.setAttribute('role', 'button');
    card.addEventListener('click', () => {
      window.location.href = `${folderName}/day${d.day}.html`;
    });
  }

  card.innerHTML = `
    <div class="day-num">${d.day}</div>
    <div class="day-title">${d.title}</div>
    ${isToday  ? '<div class="today-badge">Today</div>' : ''}
    ${isLocked ? '<div class="lock-icon">🔒</div>' : ''}
  `;

  grid.appendChild(card);
});
</script>
</body>
</html>
